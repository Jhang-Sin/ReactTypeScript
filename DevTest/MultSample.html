<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>多重條件確認視窗Demo</title>

  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 30px;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    .form-row {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 20px;
    }

    select,
    button {
      font-size: 16px;
      padding: 8px 14px;
    }

    .main-button {
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .main-button:hover {
      background: #125ca3;
    }

    #log {
      margin-top: 25px;
      padding: 15px;
      background: #1e1e1e;
      color: #eee;
      min-height: 200px;
      border-radius: 6px;
      white-space: pre-line;
      font-family: Consolas, monospace;
    }

    /* ============================================================
       Modal
       ============================================================ */

    .modal-overlay {
      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.55);

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 9999;
    }

    .modal-box {
      width: 420px;
      max-width: calc(100vw - 40px);

      background: white;

      border-radius: 10px;

      padding: 25px;

      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .modal-box h3 {
      margin-top: 0;
      color: #1976d2;
    }

    .modal-box p {
      line-height: 1.7;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;

      margin-top: 25px;
    }

    .modal-buttons button {
      min-width: 90px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-primary {
      background: #1976d2;
      color: white;
    }

    .btn-danger {
      background: #d32f2f;
      color: white;
    }

    .btn-secondary {
      background: #777;
      color: white;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>HIS多重條件確認視窗Demo</h1>
  <div class="form-row">

    <label>
      身分：
      <select id="userType">
        <option value="Q1">Q1</option>
        <option value="Q2">Q2</option>
        <option value="Q3">Q3</option>
        <option value="Q4">Q4</option>
        <option value="Q5">Q5</option>
      </select>
    </label>

    <label>
      時段：
      <select id="timePeriod">
        <option value="上午">上午</option>
        <option value="下午">下午</option>
      </select>
    </label>

    <button
      id="startBtn"
      class="main-button">
      開始判斷
    </button>

  </div>

  <h3>執行 Log</h3>

  <div id="log"></div>

</div>


<script>

/* ================================================================
   1. HIS Namespace
   ================================================================= */

window.HIS = window.HIS || {};


/* ================================================================
   2. modal.js
   =================================================================

   Modal 的責任非常單純：

   1. 顯示畫面
   2. 等待使用者操作
   3. 把結果回傳給呼叫者

   這裡使用 Promise。

   好處是：

       const result = await HIS.modal.confirm(...);

   使用起來會非常接近「同步程式碼」。

   ================================================================ */

HIS.modal = (function () {

  /**
   * 建立遮罩
   */
  function makeOverlay() {

    const overlay = document.createElement("div");

    overlay.className = "modal-overlay";

    return overlay;
  }


  /**
   * 一個按鈕的 Modal
   *
   * 使用方式：
   *
   * await HIS.modal.alert(
   *   "這是一個提示",
   *   "提示"
   * );
   *
   * 使用者按下「確認」後 Promise 才會完成。
   */
  function alert(message, title) {

    return new Promise(function(resolve) {

      const overlay = makeOverlay();

      const box = document.createElement("div");

      box.className = "modal-box";

      box.innerHTML = `
        <h3>${title || "提示"}</h3>

        <p>${message}</p>

        <div class="modal-buttons">

          <button class="btn-primary" id="m_ok">
            確認
          </button>

        </div>
      `;

      overlay.appendChild(box);

      document.body.appendChild(overlay);


      box.querySelector("#m_ok")
        .addEventListener("click", function () {

          overlay.remove();

          resolve("confirm");

        });

    });
  }


  /**
   * 兩個按鈕的 Modal
   *
   * 第一個按鈕：
   *     繼續
   *
   * 第二個按鈕：
   *     取消
   *
   * 回傳：
   *
   *     "continue"
   *
   * 或：
   *
   *     "cancel"
   */
  function confirm(message, title) {

    return new Promise(function(resolve) {

      const overlay = makeOverlay();

      const box = document.createElement("div");

      box.className = "modal-box";

      box.innerHTML = `
        <h3>${title || "確認"}</h3>

        <p>${message}</p>

        <div class="modal-buttons">

          <button
            class="btn-primary"
            id="m_continue">
            繼續
          </button>

          <button
            class="btn-danger"
            id="m_cancel">
            取消
          </button>

        </div>
      `;

      overlay.appendChild(box);

      document.body.appendChild(overlay);


      /**
       * 使用者選擇「繼續」
       */
      box.querySelector("#m_continue")
        .addEventListener("click", function () {

          overlay.remove();

          resolve("continue");

        });


      /**
       * 使用者選擇「取消」
       */
      box.querySelector("#m_cancel")
        .addEventListener("click", function () {

          overlay.remove();

          resolve("cancel");

        });

    });
  }


  return {
    alert,
    confirm
  };

})();



/* ================================================================
   3. condition-config.js
   =================================================================

   這裡只負責「設定」。

   不放判斷程式。

   例如：

   上午 Q1：

       ["A", "B", "C", "D"]

   代表 Q1 在上午有 A/B/C/D 四個條件。

   ================================================================ */

HIS.conditions = {

  morning: {

    Q1: ["A", "B", "C", "D"],

    Q2: ["A", "B", "C", "D"],

    Q3: ["A", "B", "C", "D"],

    Q4: ["A", "B", "C", "D", "E", "F", "G"],

    Q5: ["A", "B", "C", "D", "E", "F", "G"]

  },


  afternoon: {

    Q1: ["1", "3", "5"],

    Q2: ["1", "3", "5"],

    Q3: ["1", "3", "5"],

    Q4: ["A", "B", "C", "D", "E", "F", "G"],

    Q5: ["A", "B", "C", "D", "E", "F", "G"]

  }

};



/* ================================================================
   4. Condition Engine
   =================================================================

   這是整個範例最重要的地方。

   Engine 負責：

       取得條件
           ↓
       第一條
           ↓
       判斷
           ↓
       Modal
           ↓
       使用者選擇
           ↓
       決定是否進入下一條

   ================================================================ */

HIS.conditionEngine = (function () {


  /**
   * --------------------------------------------------------------
   * 取得目前身分 + 時段所對應的條件
   * --------------------------------------------------------------
   */
  function getConditions(userType, timePeriodLabel) {

    /**
     * 上午 → morning
     *
     * 下午 → afternoon
     */
    const key =
      timePeriodLabel === "上午"
        ? "morning"
        : "afternoon";


    /**
     * 找設定
     */
    const map =
      window.HIS.conditions &&
      window.HIS.conditions[key]
        ? window.HIS.conditions[key]
        : {};


    /**
     * 找指定身分
     *
     * 如果不存在，就回傳空陣列。
     */
    return map[userType] || [];

  }



  /**
   * --------------------------------------------------------------
   * 執行多重條件判斷
   * --------------------------------------------------------------
   *
   * userType：
   *     使用者身分
   *
   * timePeriodLabel：
   *     上午 / 下午
   *
   * logicCheckFn：
   *     真正的業務判斷
   *
   * 例如：
   *
   *     logicCheckFn("A")
   *
   * 回傳：
   *
   *     true
   *
   * 代表條件通過。
   *
   * ==============================================================
   *
   * 注意：
   *
   * 這裡是 async。
   *
   * 因為每一個條件都可能需要等待使用者操作 Modal。
   *
   * --------------------------------------------------------------
   */
  async function checkAll(
    userType,
    timePeriodLabel,
    logicCheckFn
  ) {

    /**
     * 取得這個身分 / 時段的所有條件
     */
    const rules =
      getConditions(
        userType,
        timePeriodLabel
      );


    log(
      `取得條件：${JSON.stringify(rules)}`
    );


    /**
     * ------------------------------------------------------------
     * 一條一條執行
     * ------------------------------------------------------------
     *
     * 這裡不能使用 Array.forEach(async ...)
     *
     * 因為 forEach 不會等待 async。
     *
     * 所以使用：
     *
     *     for...of
     *
     * 才能確保：
     *
     * Q1 → 等使用者選擇
     * Q2 → 等使用者選擇
     * Q3 → 等使用者選擇
     *
     * ------------------------------------------------------------
     */
    for (const rule of rules) {


      log(
        `開始判斷條件：${rule}`
      );


      /**
       * ----------------------------------------------------------
       * 執行真正的業務判斷
       * ----------------------------------------------------------
       *
       * logicCheckFn 可以是外部傳入的函式。
       *
       * 例如：
       *
       * function(rule) {
       *
       *     if (rule === "A") {
       *         return false;
       *     }
       *
       *     return true;
       * }
       *
       * ----------------------------------------------------------
       */

      const result =
        logicCheckFn
          ? await logicCheckFn(rule)
          : true;


      /**
       * ----------------------------------------------------------
       * 條件通過
       * ----------------------------------------------------------
       */
      if (result === true) {

        log(
          `條件 ${rule} 通過`
        );

        continue;
      }


      /**
       * ----------------------------------------------------------
       * 條件不通過
       * ----------------------------------------------------------
       *
       * 此時需要跳出確認視窗。
       *
       * ----------------------------------------------------------
       */

      log(
        `條件 ${rule} 不通過，顯示確認視窗`
      );


      const answer =
        await HIS.modal.confirm(
          `條件「${rule}」尚未通過，是否繼續下一個判斷？`,
          `條件 ${rule}`
        );


      /**
       * ----------------------------------------------------------
       * 使用者選擇「取消」
       * ----------------------------------------------------------
       *
       * 直接停止整個 Engine。
       *
       * 後面的條件：
       *
       *     不再執行
       *
       * ----------------------------------------------------------
       */
      if (answer === "cancel") {

        log(
          `使用者取消，停止判斷。停止於：${rule}`
        );


        return {
          ok: false,

          cancelled: true,

          failedRule: rule
        };
      }


      /**
       * ----------------------------------------------------------
       * 使用者選擇「繼續」
       * ----------------------------------------------------------
       *
       * 不 return。
       *
       * 直接進入 for...of 的下一圈。
       *
       * 也就是下一個條件。
       *
       * ----------------------------------------------------------
       */

      log(
        `使用者選擇繼續，進入下一個條件`
      );

    }


    /**
     * ------------------------------------------------------------
     * 所有條件都執行完成
     * ------------------------------------------------------------
     */

    log(
      `所有條件判斷完成`
    );


    return {
      ok: true,

      cancelled: false
    };

  }


  return {

    getConditions,

    checkAll

  };

})();



/* ================================================================
   5. Demo 的業務判斷
   =================================================================

   真正 HIS 系統時：

       logicCheckFn()

   裡面可以放：

   - 病人資料判斷
   - 使用者權限
   - 現在時間
   - 資料庫回傳資料
   - API 結果
   - 表單欄位
   - 其他業務規則

   這裡為了 Demo：

   「隨機」讓部分條件失敗。

   只要失敗，就會跳：

       繼續 / 取消

   ================================================================ */

async function demoLogicCheck(rule) {

  /**
   * 模擬 API / 業務判斷需要時間。
   */
  await new Promise(function(resolve) {

    setTimeout(resolve, 300);

  });


  /**
   * Demo：
   *
   * 讓 A、C、E、1、5 比較容易觸發 Modal。
   *
   * 其他條件直接通過。
   */
  const needConfirm =
    ["A", "C", "E", "1", "5"].includes(rule);


  if (needConfirm) {

    return false;

  }


  return true;

}



/* ================================================================
   6. 開始執行
   ================================================================= */

document
  .getElementById("startBtn")
  .addEventListener("click", async function () {


    /**
     * 清除 Log
     */
    document.getElementById("log").textContent = "";


    /**
     * 取得畫面上的身分
     */
    const userType =
      document.getElementById("userType").value;


    /**
     * 取得畫面上的時段
     */
    const timePeriod =
      document.getElementById("timePeriod").value;


    log(
      `========================================`
    );

    log(
      `開始判斷`
    );

    log(
      `身分：${userType}`
    );

    log(
      `時段：${timePeriod}`
    );

    log(
      `========================================`
    );


    /**
     * ------------------------------------------------------------
     * 啟動 Condition Engine
     * ------------------------------------------------------------
     */
    const result =
      await HIS.conditionEngine.checkAll(

        userType,

        timePeriod,

        demoLogicCheck

      );


    /**
     * ------------------------------------------------------------
     * 判斷最後結果
     * ------------------------------------------------------------
     */

    if (result.cancelled) {

      log(
        `流程結果：使用者取消`
      );

      return;
    }


    if (result.ok) {

      /**
       * 所有條件都完成。
       *
       * 這裡使用一個按鈕的 Alert。
       */
      await HIS.modal.alert(
        "所有條件都已完成。",
        "判斷完成"
      );


      log(
        `流程結果：全部完成`
      );

    }

  });



/* ================================================================
   7. Log 工具
   ================================================================= */

function log(message) {

  const logElement =
    document.getElementById("log");


  const time =
    new Date().toLocaleTimeString();


  logElement.textContent +=
    `[${time}] ${message}\n`;


  /**
   * 自動捲到最下面
   */
  logElement.scrollTop =
    logElement.scrollHeight;

}

</script>

</body>
</html>
