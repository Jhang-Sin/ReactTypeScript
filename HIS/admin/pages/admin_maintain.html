<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>HIS 系統維護 / 資料檢核</title>

  <!-- 共用樣式（你已規劃好的結構） -->
  <link rel="stylesheet" href="../../common/css/base.css">
  <link rel="stylesheet" href="../../common/css/layout.css">
  <link rel="stylesheet" href="../../common/css/components.css">
  <link rel="stylesheet" href="../../common/css/util.css">

  <!-- 管理頁專用樣式 -->
  <link rel="stylesheet" href="../css/admin.css">

  <!-- 共用 JS -->
  <script src="../../common/js/utilities.js"></script>
  <script src="../../common/js/modal.js"></script>

  <!-- DB 檢核核心 -->
  <script src="../../common/js/db-checker.js"></script>

  <!-- 本頁控制 JS -->
  <script src="../js/maintain.js" defer></script>
</head>

<body>
  <header class="admin-header">
    <h1>HIS 系統維護</h1>
    <div class="admin-subtitle">資料檢核 / 資料檢視</div>
  </header>

  <main class="admin-container">

    <!-- ===============================
         區塊一：資料表檢核
         =============================== -->
    <section class="admin-section">
      <h2>📋 掛號資料表檢核</h2>

      <div class="admin-actions">
        <!-- ⚠️ ID 與 maintain.js 對齊 -->
        <button id="btnCheckDB" class="btn btn-primary">
          檢核掛號資料表
        </button>
      </div>

      <!-- 檢核結果顯示區 -->
      <div id="dbCheckResult" class="admin-result">
        <!-- JS 動態填入 -->
      </div>
    </section>

    <hr />

    <!-- ===============================
         區塊二：DB Viewer
         =============================== -->
    <section class="admin-section">
      <h2>🗂️ 資料表檢視（DB Viewer）</h2>

      <div class="admin-actions">
        <label for="dbSelect">選擇資料表：</label>

        <!-- ⚠️ ID 與 maintain.js 對齊 -->
        <select id="dbSelect">
          <option value="">-- 請選擇 --</option>
        </select>

        <!-- ⚠️ ID 與 maintain.js 對齊 -->
        <button id="btnLoadDB" class="btn">
          載入資料
        </button>
      </div>

      <!-- Viewer 標題 -->
      <h3 id="dbViewTitle" class="admin-db-title"></h3>

      <!-- Viewer 結果 -->
      <div id="dbViewResult" class="admin-result">
        <!-- JS 動態填入 -->
      </div>
    </section>

  </main>

  <footer class="admin-footer">
    <small>HIS Admin Maintain © 2025</small>
  </footer>
</body>
</html>
