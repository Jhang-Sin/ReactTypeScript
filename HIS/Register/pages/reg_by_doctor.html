<div id="app" class="reg-container">

  <h2>依醫師掛號</h2>

  <select v-model="selectedDoctorId" @change="loadSchedule">
    <option value="">-- 請選擇醫師 --</option>
    <option v-for="doc in doctorList" :key="doc.id" :value="doc.id">
      {{ doc.name }}（{{ doc.department }}）
    </option>
  </select>

  <!-- 排班表：一定要防 undefined -->
  <table v-if="Array.isArray(schedule) && schedule.length > 0">
    <tr>
      <th>日期</th>
      <th>時段</th>
      <th>科別</th>
      <th></th>
    </tr>

    <tr v-for="item in schedule" :key="item.id">
      <td>{{ item.date }}</td>
      <td>{{ noonMap[item.noon]?.value }}</td>
      <td>{{ depMap[item.depCode]?.zh }}</td>
      <td>
        <button @click="register(item)">掛號</button>
      </td>
    </tr>
  </table>

  <!-- 沒資料時可顯示提示（選配） -->
  <p v-else-if="selectedDoctorId">
    查無排班資料
  </p>

</div>
