<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>模擬掛號系統</title>
  <link rel="stylesheet" href="/public/HIS/css/register-system.css">
  <script src="/public/HIS/Register/js/register-system.js" defer></script> 
</head>
<body>
  <div class="container">
    <div class="search-area">
      <label for="region">院區：</label>
      <select id="region">
        <option value="doctors.json" data-label="院區 A">院區 A</option>
        <option value="doctors2.json" data-label="院區 B">院區 B</option>
      </select>

      <label for="searchInput">病歷號/姓名：</label>
      <input type="text" id="searchInput" placeholder="輸入關鍵字搜尋...">

      <button id="searchBtn">查詢</button>
    </div>

    <table id="resultTable">
      <thead>
        <tr>
          <th>病歷號</th>
          <th>姓名</th>
          <th>性別</th>
          <th>生日</th>
          <th>科別</th>
          <th>醫師</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="6" style="text-align:center;color:#666;">請輸入病歷號或姓名進行查詢</td></tr>
      </tbody>
    </table>
  </div>
</body>
</body>
</html>
